name: ExtendedHorizons
version: ${version}
main: me.mapacheee.extendedhorizons.ExtendedHorizonsPlugin
api-version: '1.21'
folia-supported: true
description: ${description}
author: Mapacheee
dependencies:
  server:
    MapacheeeLib:
      load: BEFORE
      required: true
    WorldEdit:
      load: BEFORE
      required: false
    FastAsyncWorldEdit:
      load: BEFORE
      required: false
    PlaceholderAPI:
      load: BEFORE
      required: false

commands:
  extendedhorizons:
    description: Main ExtendedHorizons command
    usage: /<command>
    aliases: [eh]
    permission: extendedhorizons.use

permissions:
  extendedhorizons.use:
    description: Basic permission to use ExtendedHorizons
    default: true
